name: Rename to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          ls -la
          git config user.name "Ito8880"
          git config user.email "Ito8880@users.noreply.github.com"
          git mv bang-tong-risupotutosaito.html index.html
          git status
          git commit -m "Add Hamadori spots site"
          git push
